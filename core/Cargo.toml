[package]
name = "tmux-tools-core"
version = "0.10.0"
edition = "2021"

[features]
# Compiles the test-only capability override (`host::TEST_CAPABILITIES_OFF`). The
# `tmux-tools` package's `test-fixtures` feature enables it; a normal build omits it.
test-fixtures = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strip-ansi-escapes = "0.2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
toml = "0.8"
dirs = "5"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"
